# GPU overlay — accelerate in-process bge-m3 embeddings on an NVIDIA GPU.
#
# Requires the NVIDIA Container Toolkit on the host. Use ON TOP of the base:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Kept separate so the base `docker compose up` stays portable on hosts
# without a GPU (the device reservation below would otherwise fail there).

services:
  rag-server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
