# Shared RAG server for a team of developers.
#
#   docker compose up --build -d
#
# PERSISTENCE: /data holds the sqlite db, PDFs and figures. It's bind-mounted
# from a host folder (RAG_DATA_DIR, default ./rag-data) so the data lives on
# YOUR filesystem — easy to back up, inspect, and migrate, and untouched by
# image rebuilds. Point it anywhere, e.g.:  export RAG_DATA_DIR=$HOME/rag-data
# (To migrate an existing local store: copy ~/.rag/{rag.sqlite,figures,pdfs}
#  into that folder while the server is stopped.)
#
# Clients point at it with:  export RAG_SERVER_URL=http://<host>:8080
#
# Future web UI: it will be served by this same container on this same port
# (mounted under /ui by the FastAPI app) — no extra service needed.

services:
  rag-server:
    build:
      context: .
      args:
        # Include local-hf so the server can embed in-process with bge-m3
        # (matches a local store's vectors). Pulls torch — larger image.
        # `aws` gives the boto3 clients for the Bedrock text/vision backends
        # this compose file selects below.
        RAG_EXTRAS: ${RAG_EXTRAS:-server,local-hf,aws}
    image: aws-rag-server
    ports:
      - "8080:8080"
    environment:
      RAG_HOME: /data
      # --- Embedding/text/vision backends --------------------------------
      # Embeddings run in-process with bge-m3 (local, 1024-dim) to match a
      # store embedded locally. Text + vision go to Bedrock (needs ~/.aws).
      RAG_EMBEDDING_BACKEND: ${RAG_EMBEDDING_BACKEND:-local}
      RAG_LOCAL_EMBEDDING_RUNTIME: ${RAG_LOCAL_EMBEDDING_RUNTIME:-huggingface}
      RAG_LOCAL_EMBEDDING_MODEL: ${RAG_LOCAL_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
      RAG_TEXT_BACKEND: ${RAG_TEXT_BACKEND:-bedrock}
      RAG_VISION_BACKEND: ${RAG_VISION_BACKEND:-bedrock}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_PROFILE: ${AWS_PROFILE:-rag}
      #
      # --- Auth ----------------------------------------------------------
      # Tiered: a shared READ token (everyone who may search) + per-client
      # INGEST keys (minted at runtime via the admin API; cost-inducing and
      # attributable). Reads are open until a read token or any API key exists.
      #
      #   RAG_SERVER_READ_TOKEN: <shared read token>   # or mount a secret:
      #   RAG_SERVER_TOKEN_FILE: /run/secrets/read_token
      #
      # Bootstrap the first admin key (writes to the DB):
      #   docker compose exec rag-server rag-server create-key \
      #       --label bootstrap --scope admin
      # Then mint per-client ingest keys via POST /admin/keys (or `rag admin`).
      RAG_SERVER_READ_TOKEN: ${RAG_SERVER_READ_TOKEN:-}
      # Lock CORS to known browser origins (empty = no cross-origin access).
      RAG_SERVER_CORS_ORIGINS: ${RAG_SERVER_CORS_ORIGINS:-}
    volumes:
      - ${RAG_DATA_DIR:-~/.rag/rag-data}:/data
      # Persist the HuggingFace model cache (bge-m3 ~2GB) so it isn't
      # re-downloaded on every fresh container.
      - hf-cache:/root/.cache/huggingface
      # Bedrock credentials for text/vision (read-only).
      - ${HOME}/.aws:/root/.aws:ro
    # host.docker.internal resolution for talking to a host-side Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # For GPU-accelerated bge-m3, add the overlay:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    # (needs the NVIDIA container toolkit on the host). CPU works without it.

volumes:
  hf-cache:
