[project]
name = "datasheet-rag"
version = "0.1.0"
description = "Multi-scale context-aware RAG pipeline for electronics datasheets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "mcp>=2.1,<3",
    "numpy>=1.26.0",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "sqlite-vec>=0.1.6",
    "tenacity>=8.2.0",
    # Small, pure-Python HTTP client. In the base so a thin remote client
    # (CLI/MCP against a RAG server) and the Ollama backend work with a plain
    # `pip install datasheet-rag` — no extra needed.
    "httpx>=0.27",
]

[project.optional-dependencies]
# AWS backends: Bedrock (embeddings/text/vision) + Textract (OCR) + S3 storage.
# Needed whenever any RAG_*_BACKEND is "bedrock" (the default experience) or
# RAG_STORAGE_BACKEND is "s3". The code imports boto3 lazily, so a fully-local
# install (all backends local, local storage) runs without this extra.
aws = [
    "boto3>=1.35.0",
    "botocore[crt]>=1.35.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "boto3-stubs[s3,textract,bedrock-runtime]>=1.35.0",
]
tokens = [
    "tiktoken>=0.7.0",
]
docling = [
    "docling>=2.0.0",
    "pymupdf>=1.24.0",
]
# RAG HTTP server (runs in Docker, owns the sqlite db + embedder). Install
# alongside an embedding backend, e.g. `datasheet-rag[server]` (Bedrock) or
# `datasheet-rag[server,local-hf]` (fully local embeddings/vision). The thin remote
# client and the Ollama backend need nothing beyond the base (httpx is there).
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
# In-process HuggingFace runtimes (PyTorch/CUDA): sentence-transformers for
# embeddings, transformers for vision/text LLMs. Needed when any *_BACKEND=local
# uses RAG_LOCAL_*_RUNTIME=huggingface (the default for embeddings + vision).
# bitsandbytes/accelerate enable 4-bit loading of larger VLMs on limited VRAM.
local-hf = [
    "sentence-transformers>=3.0",
    "transformers>=4.49",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "torchvision>=0.18",
]

[project.scripts]
rag = "datasheet_rag.cli:cli"
rag-mcp = "datasheet_rag.mcp.server:main"
rag-server = "datasheet_rag.server.main:run"

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/JS template lines exceed the line length by nature. They live
# inside triple-quoted strings, so an inline `# noqa` would land in the markup.
"src/datasheet_rag/eval/review.py" = ["E501"]
"src/datasheet_rag/mcp/server.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

# Third-party modules that reach us untyped. Two separate reasons, one setting:
#
#   * fitz (PyMuPDF), sqlite_vec — installed, but ship no py.typed marker and
#     have no stubs on typeshed.
#   * sentence_transformers, transformers, torch — behind the `local-hf` extra,
#     which CI does not install (multi-GB torch wheels for a type check). Every
#     import of them in src/ is already lazy and guarded.
#
# Everything else the project depends on is typed, including docling and boto3
# (via boto3-stubs in the `dev` extra), and is checked normally.
[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "sentence_transformers.*",
    "sqlite_vec.*",
    "torch.*",
    "transformers.*",
]
ignore_missing_imports = true

# docling and docling-core re-export these names from their package modules
# without an __all__, which strict mode reads as "not part of the public API".
# The names are what their own docs tell you to import.
[[tool.mypy.overrides]]
module = [
    "docling.*",
    "docling_core.*",
]
implicit_reexport = true

[tool.pytest.ini_options]
# Scope collection to tests/ — a bare `pytest` otherwise walks the repo root
# and chokes on root-owned dirs like certs/.
testpaths = ["tests"]
